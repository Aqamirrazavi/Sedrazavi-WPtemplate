name: Build & Package SedRazavi WordPress Theme

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build React Bundle & Package WordPress Theme
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Lint & Typecheck
        run: npm run lint

      - name: Build React Assets
        run: npm run build

      - name: Validate WordPress Theme Structure
        run: |
          test -f wordpress-theme/style.css || exit 1
          test -f wordpress-theme/functions.php || exit 1
          test -f wordpress-theme/header.php || exit 1
          test -f wordpress-theme/footer.php || exit 1
          test -f wordpress-theme/index.php || exit 1
          test -f wordpress-theme/inc/react-shortcodes.php || exit 1
          test -f wordpress-theme/assets/dist/index.js || exit 1
          test -f wordpress-theme/assets/dist/index.css || exit 1
          echo "Theme file structure is 100% valid."

      - name: Create Theme ZIP Archive
        run: |
          cd wordpress-theme && zip -r ../sedrazavi-theme.zip ./* -x ".*"
          echo "Created sedrazavi-theme.zip successfully"

      - name: Upload Theme Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sedrazavi-wordpress-theme
          path: sedrazavi-theme.zip
          retention-days: 14
