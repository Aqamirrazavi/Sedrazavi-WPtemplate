name: Build, Test & Package SedRazavi OS Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build Bundle & Package Complete Ecosystem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: TypeScript Check
        run: bun run lint

      - name: Build React & Web Assets
        run: bun run build

      - name: Validate Theme & Plugin Integrity
        run: |
          test -f wordpress-theme/style.css || { echo "Missing theme style.css"; exit 1; }
          test -f wordpress-theme/functions.php || { echo "Missing theme functions.php"; exit 1; }
          test -f wordpress-theme/header.php || { echo "Missing theme header.php"; exit 1; }
          test -f wordpress-theme/footer.php || { echo "Missing theme footer.php"; exit 1; }
          test -f wordpress-theme/app-dist/index.js || { echo "Missing app-dist/index.js"; exit 1; }
          test -f wordpress-theme/app-dist/index.css || { echo "Missing app-dist/index.css"; exit 1; }
          test -f sedrazavi-companion/includes/class-snapshot-engine.php || { echo "Missing snapshot engine"; exit 1; }
          test -f sedrazavi-companion/includes/class-vector-patterns.php || { echo "Missing vector patterns engine"; exit 1; }
          test -f sedrazavi-companion/includes/class-role-manager.php || { echo "Missing role manager"; exit 1; }
          test -f sedrazavi-companion/includes/class-modern-comments.php || { echo "Missing modern comments"; exit 1; }
          test -f sedrazavi-companion/includes/class-mega-menu.php || { echo "Missing mega menu engine"; exit 1; }
          test -f sedrazavi-companion/includes/class-woocommerce-kit.php || { echo "Missing woocommerce kit"; exit 1; }
          test -f wordpress-theme/template-video.php || { echo "Missing template-video.php"; exit 1; }
          test -f wordpress-theme/template-podcast.php || { echo "Missing template-podcast.php"; exit 1; }
          echo "All theme, companion plugin, and Elementor multi-niche widgets are present and valid."

      - name: Run Complete Test Suite
        run: bun run test:all

      - name: Create Production ZIP Packages
        run: |
          mkdir -p release-artifacts
          node scripts/package-theme.js
          cp -f sedrazavi-*.zip release-artifacts/
          ls -la release-artifacts/
          echo "All ZIP artifacts built successfully with canonical WordPress directory structure."

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sedrazavi-production-suite
          path: release-artifacts/*
          retention-days: 30
